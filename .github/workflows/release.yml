name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release (e.g. 1.0.1 or v1.0.1). Leave empty to use the VERSION file. The tag is created on the selected commit."
        required: false
        default: ""
      dry_run:
        description: "Dry run: build everything and upload the release folder as a workflow artifact, publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then tag="$GITHUB_REF_NAME"; else tag="${INPUT_TAG:-v$file_version}"; fi
          tag="$(echo "$tag" | tr -d '[:space:]')"
          [[ "$tag" == v* ]] || tag="v$tag"   # accept "1.0.1" as well as "v1.0.1"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' is not v<semver>"; exit 1
          fi
          version="${tag#v}"
          # Every artifact carries bridge_version from VERSION, so a published tag must match it.
          if [ "$DRY_RUN" != "true" ] && [ "$version" != "$file_version" ]; then
            echo "::error::tag $tag does not match VERSION $file_version (bump VERSION, or use dry_run)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  minecraft:
    needs: version
    runs-on: ubuntu-24.04
    env:
      BRIDGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: plugins/minecraft
        run: ./gradlew buildAll --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: rel-minecraft
          path: plugins/minecraft/build/release/
          if-no-files-found: error

  rust:
    needs: version
    runs-on: ubuntu-24.04
    env:
      BRIDGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: plugins/rust/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: rel-rust
          path: plugins/rust/build/release/
          if-no-files-found: error

  hytale:
    needs: version
    runs-on: ubuntu-24.04
    env:
      BRIDGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: plugins/hytale
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: rel-hytale
          path: plugins/hytale/build/release/
          if-no-files-found: error

  fivem:
    needs: version
    runs-on: ubuntu-24.04
    env:
      BRIDGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get install -y --no-install-recommends lua5.4
      - run: node --test 'plugins/fivem/test/*.test.js'
      - run: plugins/fivem/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: rel-fivem
          path: plugins/fivem/build/release/
          if-no-files-found: error

  publish:
    needs: [version, minecraft, rust, hytale, fivem]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: rel-*
          path: release
          merge-multiple: true
      - name: Generate manifest.json and SHA256SUMS
        run: python3 .github/scripts/make_manifest.py release "$VERSION" --released-at "$(git log -1 --format=%ct)"
      - name: Release notes
        run: python3 .github/scripts/release_notes.py "$TAG" > release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.version.outputs.tag }}
          path: release/
      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Published releases are never replaced (releases.md §5): bump VERSION instead.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; bump VERSION to publish a new one"; exit 1
          fi
          flags=(--title "$TAG" --notes-file release-notes.md)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then flags+=(--verify-tag); else flags+=(--target "$GITHUB_SHA"); fi
          # A -suffix version is a pre-release; the panel ignores those unless its pre-release channel is on.
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" release/* "${flags[@]}"
