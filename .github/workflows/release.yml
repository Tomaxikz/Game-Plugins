name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Test tag to build as (e.g. v1.0.0). Dry-run: builds everything and uploads the release directory as a workflow artifact; no GitHub release is created unless 'publish' is true."
        required: true
      publish:
        description: "Create a draft GitHub release for this tag"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' is not v<semver>"; exit 1
          fi
          version="${tag#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$version" != "$file_version" ]; then
            echo "::error::tag $tag does not match VERSION $file_version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  minecraft:
    needs: version
    runs-on: ubuntu-24.04
    env:
      BRIDGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: plugins/minecraft
        run: ./gradlew buildAll --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rel-minecraft
          path: plugins/minecraft/build/release/
          if-no-files-found: error

  rust:
    needs: version
    runs-on: ubuntu-24.04
    env:
      BRIDGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: plugins/rust/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rel-rust
          path: plugins/rust/build/release/
          if-no-files-found: error

  hytale:
    needs: version
    runs-on: ubuntu-24.04
    env:
      BRIDGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: plugins/hytale
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rel-hytale
          path: plugins/hytale/build/release/
          if-no-files-found: error

  fivem:
    needs: version
    runs-on: ubuntu-24.04
    env:
      BRIDGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y --no-install-recommends lua5.4
      - run: node --test plugins/fivem/test/
      - run: plugins/fivem/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rel-fivem
          path: plugins/fivem/build/release/
          if-no-files-found: error

  publish:
    needs: [version, minecraft, rust, hytale, fivem]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rel-*
          path: release
          merge-multiple: true
      - name: Generate manifest.json and SHA256SUMS
        run: python3 .github/scripts/make_manifest.py release "$VERSION" --released-at "$(git log -1 --format=%ct)"
      - name: Release notes
        run: python3 .github/scripts/release_notes.py "$TAG" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.version.outputs.tag }}
          path: release/
      - name: Create GitHub release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event_name == 'push' && 'false' || 'true' }}
        run: |
          flags=(--title "$TAG" --notes-file release-notes.md --verify-tag)
          if [ "$DRAFT" = "true" ]; then flags=(--title "$TAG (dry run)" --notes-file release-notes.md --draft --target "$GITHUB_SHA"); fi
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* "${flags[@]}"
